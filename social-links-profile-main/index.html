<!DOCTYPE html>
<html lang="en">

<head>
  <title>Frontend Mentor | Social links profile</title>
  <meta charset="UTF-8">
  <!-- displays site properly based on user's device -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <!-- font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link  rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
>

  <!-- cssreset normalize.css -->
  <link rel="stylesheet" href="./assets/normalize.css">
  <link rel="stylesheet" href="./assets/style.css">



</head>

<body>
  <div class="wrap">
    <div class="user-wrap">
      <img class="avatar" src="./assets/images/avatar-jessica.jpeg" alt="">
      <h1>Jessica Randall</h1>
      <h2>London, United Kingdom</h2>
      <p> "Front-end developer and avid reader."</p>

      <div class="sociallink-wrap">
        <div class="sociallink">GitHub</div>
        <div class="sociallink">Frontend Mentor</div>
        <div class="sociallink">LinkedIn</div>
        <div class="sociallink">Twitter</div>
        <div class="sociallink">Instagram</div>
      </div>

    </div>

  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://dannyshi01.github.io/frontend-mentor-challenge" target="_blank">Dannyshi</a>.
  </div>
</body>

</html>
